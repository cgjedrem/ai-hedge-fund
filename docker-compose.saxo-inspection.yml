name: ${AIHF_SAXO_INSPECTION_PROJECT:?Set a unique AIHF_SAXO_INSPECTION_PROJECT}

services:
  saxo-inspection-operator:
    profiles: ["saxo-inspection"]
    image: ${AIHF_SAXO_INSPECTION_IMAGE:?Set a pinned AIHF_SAXO_INSPECTION_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        AIHF_SOURCE_REVISION: ${AIHF_SOURCE_REVISION:?Set AIHF_SOURCE_REVISION}
        AIHF_SOURCE_SHA256: ${AIHF_SOURCE_SHA256:?Set AIHF_SOURCE_SHA256}
    environment:
      HEDGE_FUND_DATA_PROVIDER: yfinance
      HEDGE_FUND_LLM_ENDPOINT: http://127.0.0.1:11434
      HEDGE_FUND_RUNTIME_ROLE: web-operator
      HEDGE_FUND_RUNTIME_PROVIDERS: ""
      HEDGE_FUND_RUNTIME_CAPABILITIES: ${HEDGE_FUND_RUNTIME_CAPABILITIES:-}
    ports:
      - "127.0.0.1:8877:8876"
    volumes:
      - saxo-inspection-data:/data
    networks:
      - saxo-inspection
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      aihf.runtime.profile: saxo-inspection
      aihf.runtime.root-purpose: saxo-inspection
    command:
      - --port
      - "8876"
      - --enable-writes-after-trust
      - --enable-network-after-trust

volumes:
  saxo-inspection-data:
    external: true
    name: ${AIHF_SAXO_INSPECTION_VOLUME:?Set the existing dedicated inspection volume}

networks:
  saxo-inspection:
    name: ${AIHF_SAXO_INSPECTION_NETWORK:?Set the unique AIHF_SAXO_INSPECTION_NETWORK}
    driver: bridge
    labels:
      aihf.runtime.profile: saxo-inspection
