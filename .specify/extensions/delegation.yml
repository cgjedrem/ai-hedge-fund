# Subsession Delegation Configuration
# Read by /speckit-* skills with a Delegation section.
# Missing or invalid file -> skills fall back silently to defaults.

# This repo runs speckit flows inside a single coordinator session
# (coordinator + dev loop). Subsession spawning is disabled; review
# steps run as subagents or inline.
mode: inline

