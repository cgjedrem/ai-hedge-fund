# The AI hedge fund in Docker.
#
#   Set an existing absolute data root first:
#     export AIHF_DATA_ROOT="$PWD/.aihf-demo-data"
#     mkdir -p "$AIHF_DATA_ROOT"
#
#   Runner profiles are opt-in. Base bridge web/web-operator profiles are
#   unsupported; use the Linux override for the supported host-local topology.
#
# The web profile is read-only inspection. The web-operator supervisor starts
# read-only; offline trust plus SIGHUP may activate paper writes/network.
# SIGUSR1 downgrades the web child before CLI inspect/revoke.
# Use web-operator only with the Linux host-network override and approved root.
# Unconfigured identity keeps runner/TUI profiles independent; Dockerfile rejects image builds without valid inputs.
#   Interactive TUI:
#     docker compose run --rm tui
#
# Provider calls stay disabled by default. `OLLAMA_BASE_URL` is not a setting.
#
# On Linux, use the docker-compose.linux.yml networking override.

services:
  runner:
    profiles: ["runner"]
    build: .
    environment:
      - HEDGE_FUND_LLM_MODEL=gemma3:4b
      - HEDGE_FUND_DATA_PROVIDER=yfinance
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
    entrypoint: ["aihf", "--root", "/data"]
    command: ["--model", "gemma3:4b", "paper", "tick", "demo-alpha"]

  runner-weekly:
    profiles: ["runner-weekly"]
    build: .
    environment:
      - HEDGE_FUND_LLM_MODEL=gemma3:4b
      - HEDGE_FUND_DATA_PROVIDER=yfinance
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
    entrypoint: ["aihf", "--root", "/data"]
    command: ["--model", "gemma3:4b", "paper", "tick", "demo-weekly"]

  tui:
    profiles: ["tui"]
    build: .
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
    entrypoint: ["aihf", "--root", "/data"]

  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        AIHF_SOURCE_REVISION: "${AIHF_SOURCE_REVISION:-unconfigured}"
        AIHF_SOURCE_SHA256: "${AIHF_SOURCE_SHA256:-unconfigured}"
    image: "aihf-web:${AIHF_SOURCE_REVISION:-unconfigured}-${AIHF_SOURCE_SHA256:-unconfigured}"
    ports:
      - "127.0.0.1:8876:8876"
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
        read_only: true
    entrypoint: ["aihf-web", "--root", "/data"]
    command: ["--port", "8876"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - webdesk

  web-operator:
    profiles: ["web-operator"]
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        AIHF_SOURCE_REVISION: "${AIHF_SOURCE_REVISION:-unconfigured}"
        AIHF_SOURCE_SHA256: "${AIHF_SOURCE_SHA256:-unconfigured}"
    image: "aihf-web:${AIHF_SOURCE_REVISION:-unconfigured}-${AIHF_SOURCE_SHA256:-unconfigured}"
    environment:
      - HEDGE_FUND_DATA_PROVIDER=yfinance
      - HEDGE_FUND_LLM_ENDPOINT=http://127.0.0.1:11434
    ports:
      - "127.0.0.1:8876:8876"
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
    entrypoint: ["aihf-web-supervisor", "--root", "/data"]
    command: ["--port", "8876", "--enable-writes-after-trust", "--enable-network-after-trust"]
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - webdesk

networks:
  webdesk:
    driver: bridge