# The AI hedge fund in Docker.
#
#   Headless runner (survives restarts, runs the daily cadence):
#     docker compose up -d runner
#
#   Interactive TUI:
#     docker compose run --rm tui
#
# One runner per fund: copy the runner service and change the fund name in
# `command`. Do not run the same fund's runner on the host and in a
# container at the same time — pid files cannot see across that boundary,
# so both would believe they own the fund.
#
# On a Linux host (home server), use the docker-compose.linux.yml override
# instead — see the README's "Home server (Linux + Tailscale)" section.

services:
  runner:
    build: .
    restart: unless-stopped
    environment:
      # Ollama models (keyless, e.g. kimi-k3:cloud) run on the HOST — inside
      # the container "localhost" is the container itself, so point this at
      # the host's Ollama. Harmless when a hosted provider is used instead.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ~/.hedge-fund:/root/.hedge-fund
    command: paper run watchtower

  # The weekly comparison copy of watchtower: same mandate, weekly cadence.
  runner-weekly:
    build: .
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ~/.hedge-fund:/root/.hedge-fund
    command: paper run watchtower-weekly

  tui:
    profiles: ["tui"]
    build: .
    stdin_open: true
    tty: true
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ~/.hedge-fund:/root/.hedge-fund