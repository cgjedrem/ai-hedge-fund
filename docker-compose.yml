# The AI hedge fund in Docker.
#
#   Set an existing absolute data root first:
#     export AIHF_DATA_ROOT="$PWD/.aihf-demo-data"
#     mkdir -p "$AIHF_DATA_ROOT"
#
#   One bounded local paper tick (explicit profile):
#     docker compose --profile runner run --rm runner
#
#   Interactive TUI:
#     docker compose run --rm tui
#
# Runner profiles use local Ollama and free Yahoo data. No runner starts by
# default.
#
# On Linux, use the docker-compose.linux.yml networking override.

services:
  runner:
    profiles: ["runner"]
    build: .
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - HEDGE_FUND_LLM_MODEL=gemma3:4b
      - HEDGE_FUND_DATA_PROVIDER=yfinance
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
    entrypoint: ["aihf", "--root", "/data"]
    command: ["--model", "gemma3:4b", "paper", "tick", "demo-alpha"]

  runner-weekly:
    profiles: ["runner-weekly"]
    build: .
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - HEDGE_FUND_LLM_MODEL=gemma3:4b
      - HEDGE_FUND_DATA_PROVIDER=yfinance
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
    entrypoint: ["aihf", "--root", "/data"]
    command: ["--model", "gemma3:4b", "paper", "tick", "demo-weekly"]

  tui:
    profiles: ["tui"]
    build: .
    stdin_open: true
    tty: true
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
    entrypoint: ["aihf", "--root", "/data"]

  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8876:8876"
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
        read_only: true
    entrypoint: ["aihf-web", "--root", "/data"]
    command: ["--port", "8876", "--container-bind"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - webdesk

networks:
  webdesk:
    driver: bridge