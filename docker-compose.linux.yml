# Linux hosts only. This override gives services host networking and preserves
# literal-loopback Ollama endpoint policy. Requires Compose 2.24.0+ for !reset.
#
#   Set AIHF_DATA_ROOT to an existing absolute root before Compose commands.
#   Runner:   docker compose -f docker-compose.yml -f docker-compose.linux.yml --profile runner run --rm runner
#   TUI:      docker compose -f docker-compose.yml -f docker-compose.linux.yml run --rm tui
#   Web inspection: set build identity args, then use --profile web up -d web.
#   Web operator:   set build identity args, then use --profile web-operator up -d web-operator.
#                   Starts read-only; explicit trust + SIGHUP activate writes,
#                   SIGUSR1 downgrades before CLI inspect/revoke.
# tui-web remains opt-in, but is not approved for use: ttyd has no configured
# credentials and is downloaded without a pinned checksum. Use TUI CLI only.
#
# Runner dispatch is free Yahoo data + local Ollama only.

services:
  runner:
    network_mode: host
    environment:
      - HEDGE_FUND_LLM_ENDPOINT=http://127.0.0.1:11434
    command: ["--enable-network", "--model", "gemma3:4b", "paper", "tick", "demo-alpha"]

  runner-weekly:
    network_mode: host
    environment:
      - HEDGE_FUND_LLM_ENDPOINT=http://127.0.0.1:11434
    command: ["--enable-network", "--model", "gemma3:4b", "paper", "tick", "demo-weekly"]

  tui:
    network_mode: host

  web:
    network_mode: host
    ports: !reset []
    networks: !reset []
    environment:
      - HEDGE_FUND_LLM_ENDPOINT=http://127.0.0.1:11434

  web-operator:
    network_mode: host
    ports: !reset []
    networks: !reset []

  # Legacy browser terminal. Explicit profile only; unresolved security review.
  tui-web:
    profiles: ["tui-web"]
    build: .
    stdin_open: true
    tty: true
    network_mode: host
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
    entrypoint: ["ttyd", "-W", "-b", "127.0.0.1", "-p", "7681", "aihf", "--root", "/data"]
