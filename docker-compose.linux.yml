# Linux hosts (e.g. a home server): Docker Desktop's `host.docker.internal`
# does not exist there. This override puts the containers on the host's own
# network, so `localhost` inside the container IS the host — Ollama at
# localhost:11434 needs no extra wiring, and no ports are published.
#
#   Set AIHF_DATA_ROOT to an existing absolute root before Compose commands.
#   Runner:   docker compose -f docker-compose.yml -f docker-compose.linux.yml --profile runner run --rm runner
#   TUI:      docker compose -f docker-compose.yml -f docker-compose.linux.yml run --rm tui
#   Web desk: docker compose -f docker-compose.yml -f docker-compose.linux.yml --profile web up -d web
#             (still published only on 127.0.0.1:8876)
#   Web TUI:  docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d tui-web
#             (serves the TUI on local loopback port 7681)
#
# See the README's Linux deployment section.

services:
  runner:
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434

  runner-weekly:
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434

  tui:
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434

  # Browser TUI: legacy app bound to local loopback.
  tui-web:
    profiles: ["tui-web"]
    build: .
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
    volumes:
      - type: bind
        source: "${AIHF_DATA_ROOT:?Set AIHF_DATA_ROOT to an existing absolute data root}"
        target: /data
    entrypoint: ["ttyd", "-W", "-b", "127.0.0.1", "-p", "7681", "aihf", "--root", "/data"]

  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434