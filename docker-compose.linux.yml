# Linux hosts (e.g. a home server): Docker Desktop's `host.docker.internal`
# does not exist there. This override puts the containers on the host's own
# network, so `localhost` inside the container IS the host — Ollama at
# localhost:11434 needs no extra wiring, and no ports are published.
#
#   runner:   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d runner
#   TUI:      docker compose -f docker-compose.yml -f docker-compose.linux.yml run --rm tui
#   Web TUI:  docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d tui-web
#             (serves the TUI on 127.0.0.1:7681; publish it to your tailnet
#             with `tailscale serve --bg 7681`)
#
# See the README's "Home server (Linux + Tailscale)" section.

services:
  runner:
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434

  runner-weekly:
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434

  tui:
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434

  # Browser TUI: the full app in a browser tab, bound to loopback so only
  # Tailscale (or an SSH tunnel) can reach it.
  tui-web:
    profiles: ["tui-web"]
    build: .
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
    entrypoint: ["ttyd", "-W", "-b", "127.0.0.1", "-p", "7681", "aihf"]